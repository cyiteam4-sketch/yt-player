<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Player</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#wrap {
  width: 100vw;
  height: 100vh;
  background: #000;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

#empty {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  color: #aaa;
  font-size: 18px;
}
</style>
</head>

<body>
<div id="wrap">
  <div id="empty">Waiting for video...</div>
</div>

<script>
function getVideoId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("v") || params.get("video") || params.get("id") || "";
}

function cleanVideoId(id) {
  return String(id || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 20);
}

function loadVideo() {
  const videoId = cleanVideoId(getVideoId());
  const wrap = document.getElementById("wrap");

  if (!videoId) {
    wrap.innerHTML = '<div id="empty">Waiting for video...</div>';
    return;
  }

  wrap.innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  `;
}

window.addEventListener("message", function(event) {
  if (!event.data) return;

  let videoId = "";

  if (typeof event.data === "string") {
    videoId = event.data;
  }

  if (typeof event.data === "object") {
    videoId = event.data.videoId || event.data.id || "";
  }

  videoId = cleanVideoId(videoId);

  if (!videoId) return;

  history.replaceState(null, "", "?v=" + encodeURIComponent(videoId));

  loadVideo();
});

loadVideo();
</script>
</body>
</html>
